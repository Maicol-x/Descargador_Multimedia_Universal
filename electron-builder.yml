appId: com.universalmediadownloader.app
productName: Universal Media Downloader
directories:
  output: dist-electron
npmRebuild: true
files:
  - "dist/**"
  - "electron/**"
  - "package.json"
  - "node_modules/**"

extraResources:
  - from: "binaries"
    to: "binaries"
    filter:
      - "yt-dlp.exe"
      - "ffmpeg.exe"
      - "ffprobe.exe"
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
portable:
  artifactName: "${productName}-Portable.exe"
